<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17243b"><title>Synthetic Phonics Lab</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#17243b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:880px;margin:auto;padding:22px 16px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:21px}.muted{color:#64748b;font-size:13px}.hero{background:#17243b;color:white;border-radius:22px;padding:26px;margin:20px 0}.hero h1{margin:5px 0 9px;font-size:27px}.hero p{color:#cbd5e1;line-height:1.7}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.nav button{white-space:nowrap}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 18px #17243b08}button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer;background:#e8eef5;color:#17243b}button.primary{background:#2563eb;color:white}button.active{background:#17243b;color:white}button:disabled{opacity:.45;cursor:not-allowed}.options{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.option{border:1px solid #cbd5e1;background:white}.option.selected{background:#dbeafe;border-color:#2563eb}.big{font-size:54px;font-weight:800;letter-spacing:2px;text-align:center;margin:20px 0}.segments{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.segment{font-size:30px;background:#eaf2ff;border-radius:12px;padding:12px 17px}.progress{height:9px;background:#e2e8f0;border-radius:9px;overflow:hidden}.bar{height:100%;background:#2563eb;transition:width .2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f1f5f9;padding:13px;border-radius:13px;text-align:center}.stat strong{display:block;font-size:23px}.input{font-size:23px;width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:13px}.feedback{padding:12px;background:#f1f5f9;border-radius:10px;margin-top:12px;line-height:1.6}.note{font-size:13px;color:#64748b;line-height:1.6}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.footer{padding:18px 0;color:#64748b;font-size:12px;line-height:1.7}h2{font-size:20px}h3{font-size:16px}p{line-height:1.7}@media(max-width:450px){.stats{grid-template-columns:repeat(3,1fr)}.stat strong{font-size:19px}.card{padding:17px}.hero{padding:20px}.big{font-size:45px}}</style></head><body><div class="shell"><header><div><div class="brand">◈ Synthetic Phonics Lab</div><div class="muted">成人非母語英語學習 · 互動原型 v0.1</div></div><button onclick="resetConfirm()">重設</button></header><div class="hero"><div class="muted" style="color:#93c5fd">LEARN · TEST · RECONSTRUCT</div><h1>從聲音到閱讀自動化</h1><p>辨識聲音、建立字素連結、合成拼讀、反向拼寫，再透過測驗找出真正的學習瓶頸。</p></div><nav class="nav" id="nav"></nav><main id="app"></main><div class="footer">本工具是探索性教學原型，並非標準化英語測驗。音訊使用裝置內建英文語音合成，可能不適合精細音素辨識；正式版應改用經審核的真人音檔。資料僅儲存在此瀏覽器的 localStorage。</div></div><script>
const tabs=[['home','總覽'],['diagnosis','能力診斷'],['sounds','字素學習'],['blend','合成拼讀'],['spell','聽音拼寫'],['report','學習報告']];
const phonemes=[{g:'m',ipa:'/m/',hint:'雙唇閉合、鼻腔共鳴',word:'mat'},{g:'s',ipa:'/s/',hint:'無聲摩擦音',word:'sat'},{g:'t',ipa:'/t/',hint:'齒齦塞音，避免額外加母音',word:'tap'},{g:'a',ipa:'/æ/',hint:'短母音，嘴巴張開',word:'mat'},{g:'sh',ipa:'/ʃ/',hint:'雙字母字素，代表一個音素',word:'ship'},{g:'i',ipa:'/ɪ/',hint:'短母音',word:'sit'}];
const words=[{w:'mat',parts:['m','a','t'],ipa:'/mæt/',zh:'墊子'},{w:'sat',parts:['s','a','t'],ipa:'/sæt/',zh:'坐（sit 的過去式）'},{w:'Sam',parts:['S','a','m'],ipa:'/sæm/',zh:'人名 Sam'},{w:'sit',parts:['s','i','t'],ipa:'/sɪt/',zh:'坐'},{w:'ship',parts:['sh','i','p'],ipa:'/ʃɪp/',zh:'船'}];
const questions=[{name:'音素覺察',q:'聽到單字時，我能辨識其中的個別聲音。'},{name:'字素對應',q:'看到字母或字母組合時，我知道常見對應音。'},{name:'合成解碼',q:'我能將個別音素連成陌生單字。'},{name:'反向拼寫',q:'聽到簡單單字後，我能寫出對應字母。'},{name:'記憶保留',q:'隔天仍能辨認前一天練過的單字。'},{name:'語義整合',q:'我能理解自己讀出的英文單字與短句。'}];
const key='phonics-lab-v01';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}};state={tab:'home',diagnosis:{},seen:[],attempts:[],soundIndex:0,blendIndex:0,spellIndex:0,...state};let feedback='',revealed=false,spelling='';function save(){localStorage.setItem(key,JSON.stringify(state))}function go(tab){state.tab=tab;feedback='';revealed=false;spelling='';save();render()}function speak(text,rate=.8){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音合成');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en')&&v.lang.includes('US'));if(v)u.voice=v;speechSynthesis.speak(u)}function nav(){document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${state.tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}function stats(){let a=state.attempts,correct=a.filter(x=>x.correct).length;return `<div class="stats"><div class="stat"><strong>${state.seen.length}</strong><span class="muted">已接觸字素</span></div><div class="stat"><strong>${a.length}</strong><span class="muted">測驗次數</span></div><div class="stat"><strong>${a.length?Math.round(correct/a.length*100)+'%':'—'}</strong><span class="muted">作答正確率</span></div></div>`}function home(){let completed=Object.keys(state.diagnosis).length;return card('學習總覽',stats()+`<p>推薦順序：先做能力自評，再學習字素、練習拼讀及拼寫。系統會保留練習紀錄。</p><div class="progress"><div class="bar" style="width:${completed/6*100}%"></div></div><p class="note">能力自評：${completed}/6 項完成</p><button class="primary" onclick="go('${completed===6?'sounds':'diagnosis'}')">${completed===6?'開始字素訓練':'開始能力診斷'} →</button>`)+card('今日訓練建議',`<p>音素辨識 4 分鐘 · 字素對應 4 分鐘 · 合成拼讀 5 分鐘 · 反向拼寫 4 分鐘 · 回顧 3 分鐘。</p><p class="note">目前原型尚未提供真實音素辨識測驗、語音錄製評分或自動化間隔複習排程。</p>`)}function diagnosis(){return card('六項能力自評',`<p class="note">請依照目前實際能力選擇，這是自我評估，不是客觀能力測驗。</p>${questions.map((q,i)=>`<div style="border-bottom:1px solid #e2e8f0;padding:12px 0"><b>${i+1}. ${q.name}</b><p>${q.q}</p><div class="options">${[['yes','可以'],['partial','不穩定'],['no','不會']].map(([v,t])=>`<button class="option ${state.diagnosis[i]===v?'selected':''}" onclick="answer(${i},'${v}')">${t}</button>`).join('')}</div></div>`).join('')}<p>${Object.keys(state.diagnosis).length}/6 已回答</p><button class="primary" onclick="go('report')">查看診斷結果 →</button>`)}function answer(i,v){state.diagnosis[i]=v;save();render()}function sounds(){let x=phonemes[state.soundIndex%phonemes.length];return card('字素—音素對應',`<div class="muted">第 ${state.soundIndex%phonemes.length+1} / ${phonemes.length} 項</div><div class="big">${x.g}</div><div class="big" style="font-size:28px">${x.ipa}</div><p style="text-align:center">${x.hint}</p><div class="row" style="justify-content:center"><button class="primary" onclick="speak('${x.word}',.65)">▶ 聽例字 ${x.word}</button><button onclick="markSound()">我已練習 ✓</button></div><p class="note">例字音訊不等於獨立音素音檔；請以 IPA 與發音指導核對，避免將字母名稱當作音素。</p>`)}function markSound(){let x=phonemes[state.soundIndex%phonemes.length];if(!state.seen.includes(x.g))state.seen.push(x.g);state.soundIndex++;save();render()}function blend(){let x=words[state.blendIndex%words.length];return card('合成拼讀',`<div class="muted">練習 ${state.blendIndex%words.length+1} / ${words.length}</div><p>先依序辨識字素，嘗試將聲音合成完整單字。</p><div class="segments">${x.parts.map(p=>`<span class="segment">${p}</span>`).join('')}</div><div class="big">${x.w}</div><div class="row"><button onclick="speak('${x.w}',.7)">▶ 聽完整單字</button><button onclick="showBlend()">顯示發音與詞義</button></div>${revealed?`<div class="feedback">${x.ipa} · ${x.zh}<br>請再次自己拼讀，與參考音比較。</div>`:''}<p><button class="primary" onclick="nextBlend()">下一個單字 →</button></p><p class="note">本練習不會自動判定口說正確與否；請勿將完成次數視為解碼準確率。</p>`)}function showBlend(){revealed=true;render()}function nextBlend(){state.blendIndex++;revealed=false;save();render()}function spell(){let x=words[state.spellIndex%words.length];return card('聽音反向拼寫',`<div class="muted">練習 ${state.spellIndex%words.length+1} / ${words.length}</div><p>先播放英文單字，聽音後輸入拼寫。請盡量不要先看答案。</p><div style="text-align:center;margin:24px"><button class="primary" onclick="speak('${x.w}',.8)">▶ 播放單字</button></div><input class="input" id="spelling" placeholder="輸入聽到的單字" autocomplete="off" autocapitalize="off" spellcheck="false" value="${spelling.replaceAll('"','&quot;')}" oninput="spelling=this.value"><p><button class="primary" onclick="checkSpell()">檢查答案</button> <button onclick="nextSpell()">下一題 →</button></p>${feedback?`<div class="feedback">${feedback}</div>`:''}<p class="note">採完全相同的拼寫比對（不區分大小寫），不進行語音辨識。可點選「下一題」跳過。</p>`)}function checkSpell(){let x=words[state.spellIndex%words.length],correct=spelling.trim().toLowerCase()===x.w.toLowerCase();state.attempts.push({word:x.w,answer:spelling.trim(),correct,time:new Date().toISOString(),type:'spelling'});feedback=`${correct?'✓ 正確':'✗ 需要再練習'}。答案：${x.w} ${x.ipa}（${x.zh}）`;save();render()}function nextSpell(){state.spellIndex++;spelling='';feedback='';save();render()}function report(){let vals=questions.map((q,i)=>({name:q.name,value:state.diagnosis[i]}));let weak=vals.filter(x=>x.value==='no'||x.value==='partial');let a=state.attempts;return card('學習報告',stats()+`<h3>能力自評</h3>${vals.map(x=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:9px 0"><span>${x.name}</span><b>${({yes:'可以',partial:'不穩定',no:'不會'})[x.value]||'尚未評估'}</b></div>`).join('')}<h3>建議優先項目</h3><p>${weak.length?weak.map(x=>x.name).join('、'):'目前未回報明顯瓶頸；仍需客觀測驗確認。'}</p><h3>最近拼寫紀錄</h3>${a.length?a.slice(-8).reverse().map(x=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${x.word} → ${x.answer||'（空白）'}</span><b>${x.correct?'正確':'錯誤'}</b></div>`).join(''):'<p class="note">尚無拼寫測驗紀錄。</p>'}<p><button onclick="exportData()">匯出學習紀錄 JSON</button></p><p class="note">正字法映射、24 小時／7 天保留率與陌生假字遷移尚未實作，不能從目前數據推斷。</p>`)}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='phonics-learning-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function resetConfirm(){if(confirm('確定清除本瀏覽器中的所有學習紀錄？此操作無法復原。')){localStorage.removeItem(key);location.reload()}}function render(){nav();document.getElementById('app').innerHTML=({home,diagnosis,sounds,blend,spell,report}[state.tab]||home)()}render();</script></body></html>
